<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جميع منتجات جنة</title>

<!-- ربط ملف CSS -->
<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- شاشة تحميل -->
<div id="initial-loading" class="loading-screen">
    <div class="loading-box">
        <div class="loading-icon">📦</div>
        <h2>جاري تحميل المنتجات...</h2>
        <div class="progress-bar"><div id="loading-progress"></div></div>
        <p id="loading-status">جاري الاتصال...</p>
    </div>
</div>

<!-- الهيدر -->
<header class="main-header">
    <h1>📦 ELEC.123 – جميع منتجات جنة</h1>

    <div class="header-buttons">
        <button id="cartBtn">🛒 السلة <span id="cartCount">0</span></button>
        <button id="totalBtn">💰 إجمالي الفاتورة</button>
        <button onclick="location.href='index.html'">🏠 الرئيسية</button>
        <button id="updateBtn">🔄 تحديث</button>
        <button id="clearCartBtn">🗑️ مسح السلة</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 ابحث عن منتج...">
        <button id="specialOfferBtn">💥 خصم للمندوب</button>
    </div>
</header>

<!-- قائمة الأقسام -->
<div class="categories-container">
    <div class="categories-bar" id="categoriesBar">
        <!-- يتم ملؤها تلقائياً من JS -->
    </div>
</div>

<!-- المنطقة الرئيسية -->
<main id="mainPage" style="display:none;">

    <!-- عرض الأقسام -->
    <section id="categoriesView" class="categories-grid"></section>

    <!-- عرض المنتجات -->
    <section id="productsView" class="products-grid" style="display:none;"></section>

</main>

<!-- زر حفظ السلة -->
<button id="saveCartBtn" class="floating-save">💾 حفظ السلة</button>

<!-- مودال كلمة المرور -->
<div id="passwordModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closePasswordModal()">×</span>
        <h2>أدخل كلمة السر لعرض الأسعار</h2>
        <input type="password" id="passwordInput" placeholder="كلمة السر">
        <button id="passwordSubmitBtn">تأكيد</button>
    </div>
</div>

<!-- مودال إجمالي الفاتورة -->
<div id="totalModal" class="modal">
    <div class="modal-content large">
        <span class="close" onclick="closeTotalModal()">×</span>
        <h2>إجمالي الفاتورة</h2>
        <div id="invoiceDate"></div>
        <table id="invoiceTable">
            <!-- يتم ملؤه تلقائياً -->
        </table>
        <div class="total-buttons">
            <button id="sendInvoiceBtn">📤 إرسال الفاتورة</button>
            <button id="saveInvoiceBtn">💾 حفظ الفاتورة</button>
        </div>
    </div>
</div>

<!-- مودال طلب منتج -->
<div id="productRequestModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeProductRequestModal()">×</span>
        <h2>طلب منتج غير متوفر</h2>
        <textarea id="requestText" placeholder="اكتب اسم المنتج..."></textarea>
        <button id="sendRequestBtn">إرسال</button>
    </div>
</div>

<!-- مودال اختيار رقم لإرسال الطلب -->
<div id="numbersModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeNumbersModal()">×</span>
        <h2>اختر رقم التواصل</h2>
        <a id="officeNumber" class="number-btn">📞 مكتب</a>
        <a id="storeNumber" class="number-btn">📞 محل</a>
        <a id="carNumber" class="number-btn">📞 سيارة</a>
    </div>
</div>


<!-- ملف الجافاسكريبت -->
<script src="app.js"></script>
</body>
</html>
